# 1) Deny all traffic in and out of the namespace by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 2) Every pod may resolve DNS, through CoreDNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 3) The app may talk to Postgres on 5432, and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-egress-to-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bank-app.appSelector" . | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "bank-app.dbSelector" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
---
# 4) Postgres accepts connections only from the app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-ingress-from-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bank-app.dbSelector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "bank-app.appSelector" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
---
# 5) Kubelet health probes come from the node itself.
#    In a real bank an internal gateway namespace would be allowed here too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-ingress-from-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bank-app.appSelector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.nodeCidr }}
      ports:
        - protocol: TCP
          port: 8080
