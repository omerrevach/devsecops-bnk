# Dedicated identities with no Kubernetes API token mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-app.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bank-app.dbName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-app.labels" . | nindent 4 }}
automountServiceAccountToken: false
