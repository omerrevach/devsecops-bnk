# Flux least privilege, applied by platform/prod/bootstrap.sh right after `flux install`.
#
# A default Flux install binds its controllers to cluster-admin (ClusterRoleBinding
# "cluster-reconciler-flux-system"), so any chart it installs could do anything in the cluster.
# bootstrap.sh deletes that binding. What remains:
#   - helm-controller keeps only Flux's own controller role (its CRDs, events, leases, source secrets);
#   - it installs releases ONLY by impersonating a service account, and may impersonate exactly one:
#     bank-app-deployer (rights defined in platform/flux/bank-app.yaml: one namespace, listed kinds);
#   - a HelmRelease without serviceAccountName runs as "flux-no-access", which has no permissions at all
#     (helm-controller flag --default-service-account, set by bootstrap.sh).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: helm-controller-impersonate
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["bank-app-deployer"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-controller-impersonate
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: helm-controller-impersonate
subjects:
  - kind: ServiceAccount
    name: helm-controller
    namespace: flux-system
