# Hardened CI/CD pipeline for the internal banking service.
#
# Runs entirely in the BUILD zone. Nothing here can reach production.
# The pipeline ends by publishing a SIGNED Helm chart to Harbor; Flux in the
# isolated prod zone pulls it, verifies the signature, and installs it.
#
#   feeds -> validate -> scan -> build -> verify -> sign -> release (manual approval, then re-checked)

# When a pipeline runs: for merge requests, and for pushes to branches without an open merge request
# (so a branch with a merge request does not get two pipelines).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Stages only group jobs in the UI; the real order comes from each job's "needs", so jobs run in parallel
# as soon as what they depend on is done.
stages:
  - feeds
  - validate
  - scan
  - build
  - verify
  - sign
  - release

variables:
  HARBOR: harbor.lab.internal
  # Tool images come ONLY from Harbor "mirror", pinned by version AND digest, so every runner (clean or with
  # a cached copy) runs exactly the same scanner and builder. Harbor checks the same digests when it mirrors
  # them (platform/harbor/mirror.txt). Update both files together, through a reviewed merge request.
  TRIVY_IMAGE: ${HARBOR}/mirror/aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  CHECKOV_IMAGE: ${HARBOR}/mirror/bridgecrew/checkov:3.4.5@sha256:122602cf32cc72286155d39f1f234b7b594818f7b8d7fdf490701620e521368b
  BUILDAH_IMAGE: ${HARBOR}/mirror/buildah/stable:v1.45.1@sha256:3f9e38e2a93798d224b3dbed9470cf4447c8c75f1ede943d96b4c367a5227631
  COSIGN_IMAGE: ${HARBOR}/mirror/sigstore/cosign/cosign:v3.1.4-dev@sha256:8af1a2cf9fba903fdfc6bdafdc25f7b13ef34ad722095543ea787fb96f7240c1
  HELM_IMAGE: ${HARBOR}/mirror/alpine/helm:4.3.2@sha256:a3b9d617c0c30a6c488cebb429c4ba83995a26dc2184599af5fd408a361b2e67
  GITLEAKS_IMAGE: ${HARBOR}/mirror/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  # Base image for installing the app's dependencies; it changes with security updates, so it is pinned by
  # digest in app/Dockerfile at import time rather than here.
  PYTHON_IMAGE: ${HARBOR}/mirror/library/python:3.13-slim
  # Artifacts
  APP_IMAGE: ${HARBOR}/staging/bank-app
  RELEASE_IMAGE: ${HARBOR}/release/bank-app
  STAGING_CHART: ${HARBOR}/staging/charts/bank-app
  CHART_REPO: ${HARBOR}/release/charts/bank-app
  # Pipeline ID is unique across GitLab, so a recreated project never reuses an (immutable) release tag.
  RELEASE_VERSION: "1.0.${CI_PIPELINE_ID}"
  # Offline vulnerability DB: fetched from the internal mirror, never from the internet.
  TRIVY_DB_REPO: ${HARBOR}/mirror/aquasecurity/trivy-db:2
  TRIVY_CACHE_DIR: ${CI_PROJECT_DIR}/.trivycache
  TRIVY_NO_PROGRESS: "true"
  TRIVY_DISABLE_VEX_NOTICE: "true"
  MAX_DB_AGE_HOURS: "48"
  # Private key lives in AWS KMS; only the release runner's IAM role can use it.
  COSIGN_KEY: awskms:///alias/bank-lab-release-signing
  # Air-gapped signing: no public transparency log, no signing config from the public Sigstore service;
  # classic .sig format, which Flux and Harbor verify.
  COSIGN_SIGN_FLAGS: --yes --use-signing-config=false --tlog-upload=false --new-bundle-format=false
  # Public CAs + lab CA (mounted read-only by the runner).
  SSL_CERT_FILE: /etc/lab-ca/ca-bundle.crt
  REQUESTS_CA_BUNDLE: /etc/lab-ca/ca-bundle.crt

# By default every job runs on the build runner (no internet, no AWS rights, cannot sign).
default:
  tags: [build]
  interruptible: true

# Audit evidence is kept for a year (assignment-defined retention for this lab).
.evidence:
  artifacts:
    when: always
    expire_in: 1 year

# Every Trivy job fetches the vulnerability DB from the internal mirror (seconds) and fails closed if the
# mirror is down, the DB is older than MAX_DB_AGE_HOURS, or its date is in the future (DECISIONS.md #1).
# The DB is too big to pass between jobs, and checking it in each job means no scan runs on a stale DB.
.trivy-db:
  before_script:
    - trivy image --download-db-only --db-repository "$TRIVY_DB_REPO" --cache-dir "$TRIVY_CACHE_DIR"
    - sh scripts/feed-check.sh "$TRIVY_CACHE_DIR/db/metadata.json" "$MAX_DB_AGE_HOURS"

# ---------------------------------------------------------------- feeds
# Gate 0: is the vulnerability database there and fresh? Every later scan depends on it.
feed-check:
  stage: feeds
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  before_script: !reference [.trivy-db, before_script]
  script:
    - echo "Vulnerability feed is reachable and fresh."

# ---------------------------------------------------------------- validate
# Gate: the CVE exceptions file is valid (strict format, at most 30 days).
exceptions-lint:
  stage: validate
  image:
    name: $CHECKOV_IMAGE
    entrypoint: [""]
  needs: []
  script:
    # Strict format: one exact package version, ticket, owner, reason, compensating control, <= 30 days.
    - python3 scripts/check_exceptions.py security/exceptions.yaml

# Gate: no secret (token, key, password) anywhere in the Git history.
secrets-scan:
  stage: validate
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
  needs: []
  variables:
    GIT_DEPTH: "0" # full history: a secret deleted in a later commit is still leaked
    # The checkout belongs to another user than the job; tell git that is fine (no config file needed).
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: "*"
  script:
    # Built-in rules only, no network access. Findings are redacted in the log and the report.
    - >
      gitleaks git --config .gitleaks.toml --redact --no-banner
      --report-format json --report-path gitleaks-report.json .
  artifacts:
    when: always
    paths: [gitleaks-report.json]
    expire_in: 30 days

# Gate: the Helm chart is valid; its rendered YAML is handed to iac-k8s for scanning.
chart-lint:
  stage: validate
  image:
    name: $HELM_IMAGE
    entrypoint: [""]
  needs: []
  script:
    # Lint the chart (incl. values.schema.json) and render it for the Kubernetes scan.
    - sh scripts/render-chart.sh rendered
  artifacts:
    paths: [rendered/]
    expire_in: 3 hours

# ---------------------------------------------------------------- scan
# Gate: no Critical CVE in the Python dependencies (SCA = software composition analysis).
sca:
  stage: scan
  extends: .evidence
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  needs: [feed-check, exceptions-lint, secrets-scan]
  before_script: !reference [.trivy-db, before_script]
  script:
    - sh scripts/trivy-scan.sh fs app/ trivy-sca
  artifacts:
    paths: [trivy-sca.json]
    reports:
      junit: trivy-sca-junit.xml

# IaC is scanned per framework, each job failing if it scanned nothing or could not parse a file.
iac-terraform:
  stage: scan
  image:
    name: $CHECKOV_IMAGE
    entrypoint: [""]
  needs: []
  script:
    - sh scripts/iac-scan.sh terraform iac-terraform terraform
  artifacts:
    when: always
    paths: [iac-terraform.json]
    reports:
      junit: iac-terraform-junit.xml

iac-k8s:
  stage: scan
  image:
    name: $CHECKOV_IMAGE
    entrypoint: [""]
  needs: [chart-lint]
  script:
    # The rendered chart (the workloads) and the platform config Flux runs with in prod.
    - sh scripts/iac-scan.sh kubernetes iac-k8s rendered platform/flux
  artifacts:
    when: always
    paths: [iac-k8s.json]
    reports:
      junit: iac-k8s-junit.xml

# ---------------------------------------------------------------- build
# Download the Python packages, only from GitLab's internal registry, checked against their hashes.
wheels:
  stage: build
  image: $PYTHON_IMAGE
  needs: [sca, iac-terraform, iac-k8s]
  variables:
    PIP_CERT: /etc/lab-ca/ca-bundle.crt
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    # Internal PyPI registry (GitLab). Forwarding to pypi.org is disabled in GitLab admin.
    PIP_INDEX_URL: https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lab.internal/api/v4/projects/${CI_PROJECT_ID}/packages/pypi/simple
  script:
    - 'pip download --no-deps --require-hashes --only-binary=:all: -r app/requirements.txt -d app/wheels'
  artifacts:
    paths: [app/wheels/]
    expire_in: 3 hours

# Build the image (Buildah: no Docker daemon) and push it to Harbor "staging". The digest is passed on.
build:
  stage: build
  image:
    name: $BUILDAH_IMAGE
    entrypoint: [""]
  needs: [wheels]
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: oci
  script:
    - echo "$HARBOR_CI_TOKEN" | buildah login --cert-dir /etc/lab-ca -u "$HARBOR_CI_USER" --password-stdin "$HARBOR"
    - buildah build --cert-dir /etc/lab-ca -f app/Dockerfile -t "$APP_IMAGE:$CI_COMMIT_SHORT_SHA" app/
    - buildah push --cert-dir /etc/lab-ca --digestfile image.digest "$APP_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "IMAGE_DIGEST=$(cat image.digest)" > build.env
    - cat build.env
  artifacts:
    paths: [image.digest]
    reports:
      dotenv: build.env

# ---------------------------------------------------------------- verify
# Every workload image in the release is gated: the app image AND the database image the chart deploys.
image-scan:
  stage: verify
  extends: .evidence
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  needs: [feed-check, build]
  before_script: !reference [.trivy-db, before_script]
  script:
    - export TRIVY_USERNAME="$HARBOR_CI_USER" TRIVY_PASSWORD="$HARBOR_CI_TOKEN"
    - sh scripts/trivy-scan.sh image "$APP_IMAGE@$IMAGE_DIGEST" trivy-image
    - unset TRIVY_USERNAME TRIVY_PASSWORD # the mirror is public inside the VPC
    - sh scripts/trivy-scan.sh image "$(sh scripts/chart-image.sh postgres)" trivy-db-image
  artifacts:
    paths: [trivy-image.json, trivy-db-image.json]
    reports:
      junit: [trivy-image-junit.xml, trivy-db-image-junit.xml]

# The approval in security/exceptions.yaml is only a name. The proof is GitLab's record: the change that
# last edited the file came from a merge request approved by a Maintainer who is not its author.
exception-approvals:
  stage: verify
  image:
    name: $CHECKOV_IMAGE
    entrypoint: [""]
  needs: [exceptions-lint]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - python3 scripts/check_exception_approval.py security/exceptions.yaml exception-approval.json
  artifacts:
    when: always
    paths: [exception-approval.json]
    expire_in: 1 year

# ---------------------------------------------------------------- sign (release runner, main only)
# Template for jobs on the release runner: protected (main only), the only one allowed to sign with KMS.
.release-runner:
  tags: [release]
  interruptible: false
  image:
    name: $COSIGN_IMAGE
    entrypoint: [""]
  before_script:
    - echo "$HARBOR_RELEASE_TOKEN" | cosign login "$HARBOR" -u "$HARBOR_RELEASE_USER" --password-stdin

# Sign the image digest with the KMS key (main only, after every scan passed and the approval was checked).
sign-image:
  extends: .release-runner
  stage: sign
  needs: [build, image-scan, exception-approvals]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # KMS signs the digest; the private key never leaves KMS.
    - cosign sign $COSIGN_SIGN_FLAGS --key "$COSIGN_KEY" "$APP_IMAGE@$IMAGE_DIGEST"
    - cosign verify --key "$COSIGN_KEY" --insecure-ignore-tlog=true "$APP_IMAGE@$IMAGE_DIGEST" > /dev/null

# ---------------------------------------------------------------- release
# The human release approval. Only users allowed to merge into main (Security) can run it.
promote:
  stage: release
  image:
    name: $CHECKOV_IMAGE
    entrypoint: [""]
  needs: [sign-image]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  allow_failure: false
  interruptible: false
  environment:
    name: production
  resource_group: production
  script:
    - >
      python3 -c 'import json, os, datetime; json.dump({"approved_by": os.environ["GITLAB_USER_LOGIN"],
      "approved_at": datetime.datetime.now(datetime.timezone.utc).isoformat(), "job": os.environ["CI_JOB_URL"]},
      open("release-approval.json", "w"), indent=2)'
    - cat release-approval.json
  artifacts:
    paths: [release-approval.json]
    expire_in: 1 year

# Time passes between the scans and the approval. Re-check everything that can expire, right before
# publishing: DB freshness, a rescan of the exact images, exception validity and approval.
release-check:
  stage: release
  extends: .evidence
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  needs: [promote, build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: production
  before_script: !reference [.trivy-db, before_script]
  script:
    - cp "$TRIVY_CACHE_DIR/db/metadata.json" trivy-db-metadata.json
    - trivy --version > trivy-version.txt
    - export TRIVY_USERNAME="$HARBOR_CI_USER" TRIVY_PASSWORD="$HARBOR_CI_TOKEN"
    - sh scripts/trivy-scan.sh image "$APP_IMAGE@$IMAGE_DIGEST" release-scan-app
    - unset TRIVY_USERNAME TRIVY_PASSWORD
    - sh scripts/trivy-scan.sh image "$(sh scripts/chart-image.sh postgres)" release-scan-db
  artifacts:
    paths: [release-scan-app.json, release-scan-db.json, trivy-db-metadata.json, trivy-version.txt]

# Re-validate the exception and its approval, then build the evidence record of why this release is allowed.
release-policy:
  stage: release
  extends: .evidence
  image:
    name: $CHECKOV_IMAGE
    entrypoint: [""]
  needs: [release-check, promote, build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: production
  script:
    - python3 scripts/check_exceptions.py security/exceptions.yaml
    - python3 scripts/check_exception_approval.py security/exceptions.yaml exception-approval.json
    # One record of why this release was allowed; publish-image signs it and attaches it to the image.
    - python3 scripts/release-evidence.py > release-evidence.json
    - cat release-evidence.json
  artifacts:
    paths: [release-evidence.json, exception-approval.json]

# Copy the signed image to Harbor "release" and attach the signed evidence record to it.
publish-image:
  extends: .release-runner
  stage: release
  needs: [release-policy, build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: production
  script:
    # Copy image + its signature from staging to release (same digest), then attach the signed evidence.
    - cosign copy "$APP_IMAGE@$IMAGE_DIGEST" "$RELEASE_IMAGE:$RELEASE_VERSION"
    - cosign verify --key "$COSIGN_KEY" --insecure-ignore-tlog=true "$RELEASE_IMAGE@$IMAGE_DIGEST" > /dev/null
    - >
      cosign attest $COSIGN_SIGN_FLAGS --key "$COSIGN_KEY" --type https://bank.lab.internal/release-evidence/v1
      --predicate release-evidence.json "$RELEASE_IMAGE@$IMAGE_DIGEST"
    - >
      cosign verify-attestation --key "$COSIGN_KEY" --insecure-ignore-tlog=true
      --type https://bank.lab.internal/release-evidence/v1 "$RELEASE_IMAGE@$IMAGE_DIGEST" > /dev/null

# Package the chart with the exact image digest inside, and push it (to staging first, see below).
publish-chart:
  stage: release
  tags: [release]
  interruptible: false
  image:
    name: $HELM_IMAGE
    entrypoint: [""]
  needs: [build, publish-image]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: production
  script:
    # Bake the exact digest that was scanned and signed into the chart; prod installs it with no overrides.
    - 'sed -i "s|^  digest: \"\"$|  digest: \"${IMAGE_DIGEST}\"|" charts/bank-app/values.yaml'
    - 'grep -q "digest: \"${IMAGE_DIGEST}\"" charts/bank-app/values.yaml'
    - helm lint --strict charts/bank-app
    - helm package charts/bank-app --version "$RELEASE_VERSION" --app-version "$CI_COMMIT_SHORT_SHA" --destination dist
    - echo "$HARBOR_RELEASE_TOKEN" | helm registry login "$HARBOR" -u "$HARBOR_RELEASE_USER" --password-stdin
    # Harbor's release project serves only signed artifacts, so the chart goes to staging first;
    # sign-chart signs it there and copies chart + signature into release together.
    - helm push "dist/bank-app-${RELEASE_VERSION}.tgz" "oci://${HARBOR}/staging/charts" 2>&1 | tee push.log
    - 'CHART_DIGEST=$(sed -n "s/^Digest: *//p" push.log)'
    - test -n "$CHART_DIGEST"
    - echo "CHART_DIGEST=${CHART_DIGEST}" > chart.env
  artifacts:
    reports:
      dotenv: chart.env

# Sign the chart and copy it, with its signature, to Harbor "release". Flux in prod picks it up from there.
sign-chart:
  extends: .release-runner
  stage: release
  needs: [publish-chart]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: production
  script:
    - cosign sign $COSIGN_SIGN_FLAGS --key "$COSIGN_KEY" "${STAGING_CHART}@${CHART_DIGEST}"
    - cosign copy "${STAGING_CHART}@${CHART_DIGEST}" "${CHART_REPO}:${RELEASE_VERSION}"
    - cosign verify --key "$COSIGN_KEY" --insecure-ignore-tlog=true "${CHART_REPO}:${RELEASE_VERSION}" > /dev/null
    - echo "Release ${RELEASE_VERSION} published and signed. Flux in prod installs it within ~1 minute."
